<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>E-commerce</title>
  </head>
  <body>
    <header>
      <h1>Página Principal</h1>
    </header>
    <main class="container">
      <article class="card">
        <img class="card-imagem" src="Fone.png" alt="imagem do produto" />
        <div class="card-conteudo">
          <h2>Fone Bluetooth</h2>
          <p>Fone sem fio, confortável, e com bateria de longa duração.</p>
          <p class="preco">R$ 279,90</p>
          <button>Comprar</button>
        </div>
      </article>
    </main>

    <footer>
      <p>Todos os direitos reservados a Diva</p>
    </footer>
  </body>
</html>
