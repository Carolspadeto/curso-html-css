<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Aba login</title>
  </head>
  <body>
    <main class="login-card">
      <header class="login-header">
        <h1>Bem vindo de volta!</h1>
        <p>Insira suas credenciais para acessar a sua conta.</p>
      </header>
      <form class="login-form">
        <div class="input-group">
          <label for="escreva seu email">email</label>
          <input type="email" placeholder="exmplo @email.com" />
        </div>
        <div class="senha-group">
          <label for="escreva sua senha">senha</label>
          <input type="password" placeholder="digite a sua senha" />
        </div>
        <button type="Submit" class="botao-entrar">entrar</button>
      </form>

      <footer class="login-footer">
        <p>Não tem uma conta?</p>
        <a href="#">Criar cadastro</a>
      </footer>
    </main>
  </body>
</html>
